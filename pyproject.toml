[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice agent platform with LiveKit, LangGraph, VoiceStudio"
requires-python = ">=3.11"
dependencies = [
    "livekit>=0.17",
    "livekit-agents>=0.5",
    "langchain>=0.3",
    "langgraph>=0.2",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "websockets>=12",
    "rich>=13",
    "pydantic>=2",
    "toml>=0.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
